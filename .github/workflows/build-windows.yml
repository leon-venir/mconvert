name: Build Windows executable

# PyInstaller does not cross-compile (see build.spec): a Windows .exe has to
# be produced by PyInstaller running on Windows, which this developer
# machine is not. This workflow does that build on a windows-latest runner
# instead of requiring anyone to own a physical Windows machine.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build with PyInstaller
        run: pyinstaller build.spec

      - name: Upload mconvert.exe
        uses: actions/upload-artifact@v4
        with:
          name: mconvert-windows
          path: dist/mconvert.exe
